<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Elite Tiles & Construction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Elite Tiles & Construction</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="quotes.html">Quotes</a></li>
            </ul>
            <div class="hamburger">☰</div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Contact Us</h1>
                <p>Have a question or want to start your project? Reach out to us below!</p>
            </div>
            <div class="hero-image">
                <img src="pictures/image-4.jpg" alt="Contact Elite Tiles & Construction">
            </div>
        </section>
        <section class="contact" style="max-width: 600px; margin: 40px auto 0 auto;">
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="message">Message:</label>
                <textarea id="message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
            <p id="form-message"></p>
        </section>
    </main>
    <footer>
        <div class="footer-menu">
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="services.html">Services</a> |
            <a href="products.html">Products</a> |
            <a href="contact.html">Contact</a> |
            <a href="quotes.html">Quotes</a>
        </div>
        <p class="footer-copy">&copy; 2025 Elite Tiles & Construction. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
